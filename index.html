<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reverse: Era Log</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Noto+Serif+KR:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <div class="vintage-overlay"></div>
  
  <div id="game-container">
    <header id="status-bar">
      <div class="status-item">
        <span class="label">FLOOR</span>
        <span class="value"><span id="current-floor">1</span><span class="sub">/3</span></span>
      </div>
      <div class="status-divider"></div>
      <div class="status-item">
        <span class="label">VITALITY</span>
        <span class="value"><span id="current-hp">100</span><span class="sub">/100</span></span>
      </div>
      <div class="status-divider"></div>
      <div class="status-item relics-box">
        <span class="label">ARTIFACTS</span>
        <span class="value relic-text" id="relics-list">None</span>
      </div>
    </header>

    <section id="map-section">
      <div class="map-title">1층 경로 (원하는 노드를 클릭하세요)</div>
      <div id="node-map">
        <div class="node clickable" data-step="1" data-type="전투">
          <span class="node-num">I</span>
          <span class="node-label">전투</span>
        </div>
        <div class="node" data-step="2" data-type="사건">
          <span class="node-num">II</span>
          <span class="node-label">사건</span>
        </div>
        <div class="node" data-step="3" data-type="보상">
          <span class="node-num">III</span>
          <span class="node-label">보상</span>
        </div>
        <div class="node" data-step="4" data-type="전투">
          <span class="node-num">IV</span>
          <span class="node-label">전투</span>
        </div>
        <div class="node boss" data-step="5" data-type="보스">
          <span class="node-num">V</span>
          <span class="node-label">보스</span>
        </div>
      </div>
    </section>

    <main id="event-section">
      <div class="event-header">
        <span class="event-badge" id="event-badge">STAGE START</span>
        <h2 id="event-title">1층 탐험 시작</h2>
      </div>
      <hr class="gold-divider">
      <p id="event-description">위 지도에서 'I. 전투' 노드를 클릭하여 진입하세요.</p>
      
      <div id="choices-container"></div>
    </main>
  </div>

  <script src="./main.js"></script>
</body>
</html>
